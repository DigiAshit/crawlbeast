<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Agency SEO audit tool selection journey</title>
  <desc id="desc">A six-step decision journey from defining agency jobs and constraints through shortlisting, representative trials, validation, scoring, and selecting a tool stack.</desc>
  <rect width="1400" height="620" fill="#f7f8fa"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17212b">Choose the stack by testing the work</text>
  <text x="70" y="111" font-family="Arial, sans-serif" font-size="18" fill="#53616f">Move from a feature list to a defensible agency decision.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 175)"><rect width="190" height="205" rx="6" fill="#fff" stroke="#94a2ae" stroke-width="2"/><circle cx="35" cy="35" r="19" fill="#216eaa"/><text x="30" y="42" font-size="18" font-weight="700" fill="#fff">1</text><text x="65" y="42" font-size="21" font-weight="700" fill="#17212b">Define</text><text x="24" y="88" font-size="16" fill="#53616f">Jobs sold</text><text x="24" y="118" font-size="16" fill="#53616f">Client types</text><text x="24" y="148" font-size="16" fill="#53616f">Required evidence</text><text x="24" y="178" font-size="16" fill="#53616f">Constraints</text></g>
    <g transform="translate(284 175)"><rect width="190" height="205" rx="6" fill="#fff" stroke="#94a2ae" stroke-width="2"/><circle cx="35" cy="35" r="19" fill="#216eaa"/><text x="30" y="42" font-size="18" font-weight="700" fill="#fff">2</text><text x="65" y="42" font-size="21" font-weight="700" fill="#17212b">Shortlist</text><text x="24" y="88" font-size="16" fill="#53616f">Deployment</text><text x="24" y="118" font-size="16" fill="#53616f">Scale</text><text x="24" y="148" font-size="16" fill="#53616f">Workflow fit</text><text x="24" y="178" font-size="16" fill="#53616f">Three candidates</text></g>
    <g transform="translate(498 175)"><rect width="190" height="205" rx="6" fill="#fff" stroke="#94a2ae" stroke-width="2"/><circle cx="35" cy="35" r="19" fill="#216eaa"/><text x="30" y="42" font-size="18" font-weight="700" fill="#fff">3</text><text x="65" y="42" font-size="21" font-weight="700" fill="#17212b">Trial</text><text x="24" y="88" font-size="16" fill="#53616f">Real client sites</text><text x="24" y="118" font-size="16" fill="#53616f">Same scope</text><text x="24" y="148" font-size="16" fill="#53616f">Same tasks</text><text x="24" y="178" font-size="16" fill="#53616f">Record time</text></g>
    <g transform="translate(712 175)"><rect width="190" height="205" rx="6" fill="#fff" stroke="#94a2ae" stroke-width="2"/><circle cx="35" cy="35" r="19" fill="#237a57"/><text x="30" y="42" font-size="18" font-weight="700" fill="#fff">4</text><text x="65" y="42" font-size="21" font-weight="700" fill="#17212b">Validate</text><text x="24" y="88" font-size="16" fill="#53616f">Sample issues</text><text x="24" y="118" font-size="16" fill="#53616f">Check limits</text><text x="24" y="148" font-size="16" fill="#53616f">Create ticket</text><text x="24" y="178" font-size="16" fill="#53616f">Re-crawl change</text></g>
    <g transform="translate(926 175)"><rect width="190" height="205" rx="6" fill="#fff" stroke="#94a2ae" stroke-width="2"/><circle cx="35" cy="35" r="19" fill="#237a57"/><text x="30" y="42" font-size="18" font-weight="700" fill="#fff">5</text><text x="65" y="42" font-size="21" font-weight="700" fill="#17212b">Score</text><text x="24" y="88" font-size="16" fill="#53616f">Weighted criteria</text><text x="24" y="118" font-size="16" fill="#53616f">Evidence</text><text x="24" y="148" font-size="16" fill="#53616f">Annual cost</text><text x="24" y="178" font-size="16" fill="#53616f">Team feedback</text></g>
    <g transform="translate(1140 175)"><rect width="190" height="205" rx="6" fill="#fff" stroke="#94a2ae" stroke-width="2"/><circle cx="35" cy="35" r="19" fill="#237a57"/><text x="30" y="42" font-size="18" font-weight="700" fill="#fff">6</text><text x="65" y="42" font-size="21" font-weight="700" fill="#17212b">Select</text><text x="24" y="88" font-size="16" fill="#53616f">Smallest stack</text><text x="24" y="118" font-size="16" fill="#53616f">Document roles</text><text x="24" y="148" font-size="16" fill="#53616f">Train team</text><text x="24" y="178" font-size="16" fill="#53616f">Review later</text></g>
    <path d="M260 278H284M474 278H498M688 278H712M902 278H926M1116 278H1140" stroke="#53616f" stroke-width="4"/>
    <text x="70" y="465" font-size="19" font-weight="700" fill="#17212b">Point A</text><text x="147" y="465" font-size="18" fill="#53616f">“Every tool looks capable.”</text>
    <text x="980" y="465" font-size="19" font-weight="700" fill="#17212b">Point Z</text><text x="1057" y="465" font-size="18" fill="#53616f">“This stack passed our work.”</text>
    <text x="70" y="535" font-size="16" fill="#53616f">Do not score features you will not use. Validate representative findings before trusting severity labels.</text>
  </g>
</svg>
